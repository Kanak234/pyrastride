[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrastride"
version = "0.1.0"
description = "Bridge PyraSec static-scan SARIF findings into a STRIDE threat-model view"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kanak Prabhakar" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
pyrastride = "pyrastride.cli:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
